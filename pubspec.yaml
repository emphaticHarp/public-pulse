name: public_pulse
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.4+5

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # Check internet connectivity status on the device
  connectivity_plus: ^7.3.0
  # Verify internet connection availability with multiple checks
  internet_connection_checker_plus: ^3.1.1
  # State management and routing solution
  get: ^4.7.3
  # Pick images from device gallery or camera
  image_picker: ^1.2.3
  # Handle device permissions (camera, location, etc.)
  permission_handler: ^12.0.3
  # Integrate Apple Sign-In authentication
  sign_in_with_apple: ^6.1.0
  # Store and retrieve app preferences locally
  shared_preferences: ^2.5.5
  # Backend database and authentication with Supabase
  supabase_flutter: ^2.16.0
  # Load environment variables from .env file
  flutter_dotenv: ^6.0.1
  # Integrate Google Sign-In authentication
  google_sign_in: ^6.3.0
  # Make HTTP requests to APIs
  http: ^1.6.0
  # PIN input widget for OTP verification
  pinput: ^6.0.2
  # Get device file system paths
  path_provider: ^2.1.6
  # Compress images to reduce file size
  flutter_image_compress: ^2.5.1
  # State management for reactive UI updates
  provider: ^6.1.2
  # Read EXIF metadata from images
  exif: ^3.3.0
  # Get current device geolocation
  geolocator: ^14.0.3
  # HTTP client for API requests with interceptors
  dio: ^5.11.0
  # Manage app permissions
  permission_manager: ^2.0.9
  # Local NoSQL database for data storage
  hive_ce: ^2.19.3
  # Flutter integration for Hive database
  hive_ce_flutter: ^2.3.4
  # Cryptographic functions for secure data
  crypto: ^3.0.7
  # Image processing and manipulation
  image: ^4.8.0
  # Get MIME types for files
  mime: ^2.0.0
  # Get device information (model, OS version, etc.)
  device_info_plus: ^13.2.0
  # Get app package information (version, build number)
  package_info_plus: ^10.2.1
  # Cache and load images from network efficiently
  cached_network_image: ^3.4.1
  # Generate unique identifiers
  uuid: ^4.6.0
  # Launch URLs and open links
  url_launcher: ^6.3.2
  # Convert coordinates to addresses and vice versa
  geocoding: ^4.0.0
  http_parser: ^4.1.2
  tiktok_double_tap_like: ^1.0.5+2
  webview_flutter: ^4.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  # Code style and best practices linting rules
  flutter_lints: ^6.0.0
  # Generate app launcher icons for iOS and Android
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
# NOTE: there must be only ONE top-level `flutter:` key — a duplicate key
# silently overwrites the first, which is why `assets:` was being ignored.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
  - assets/images/
  - .env

  fonts:
  - family: Poppins
    fonts:
    - asset: assets/font/Poppins-Thin.ttf
      weight: 100

    - asset: assets/font/Poppins-ThinItalic.ttf
      weight: 100
      style: italic

    - asset: assets/font/Poppins-ExtraLight.ttf
      weight: 200

    - asset: assets/font/Poppins-ExtraLightItalic.ttf
      weight: 200
      style: italic

    - asset: assets/font/Poppins-Light.ttf
      weight: 300

    - asset: assets/font/Poppins-LightItalic.ttf
      weight: 300
      style: italic

    - asset: assets/font/Poppins-Regular.ttf
      weight: 400

    - asset: assets/font/Poppins-Italic.ttf
      weight: 400
      style: italic

    - asset: assets/font/Poppins-Medium.ttf
      weight: 500

    - asset: assets/font/Poppins-MediumItalic.ttf
      weight: 500
      style: italic

    - asset: assets/font/Poppins-SemiBold.ttf
      weight: 600

    - asset: assets/font/Poppins-SemiBoldItalic.ttf
      weight: 600
      style: italic

    - asset: assets/font/Poppins-Bold.ttf
      weight: 700

    - asset: assets/font/Poppins-BoldItalic.ttf
      weight: 700
      style: italic

    - asset: assets/font/Poppins-ExtraBold.ttf
      weight: 800

    - asset: assets/font/Poppins-ExtraBoldItalic.ttf
      weight: 800
      style: italic

    - asset: assets/font/Poppins-Black.ttf
      weight: 900

    - asset: assets/font/Poppins-BlackItalic.ttf
      weight: 900
      style: italic

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/log.webp"
  min_sdk_android: 21
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
